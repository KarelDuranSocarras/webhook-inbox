services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook-inbox-postgres
    environment:
      POSTGRES_DB: webhookinbox
      POSTGRES_USER: webhookinbox
      POSTGRES_PASSWORD: webhookinbox
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhookinbox -d webhookinbox"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
