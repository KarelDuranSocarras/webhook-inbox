spring:
  application:
    name: webhook-inbox
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

webhook-inbox:
  max-body-bytes: ${APP_MAX_BODY_BYTES:1048576}
  token-length: 24
  default-page-size: 25
  retention-days: ${APP_RETENTION_DAYS:7}
  retention-enabled: ${APP_RETENTION_ENABLED:true}
  retention-cron: ${APP_RETENTION_CRON:0 0 * * * *}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${APP_RATE_LIMIT_RPM:100}
